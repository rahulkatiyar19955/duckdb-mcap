name: Build & Release mcap extension

# Builds the `mcap` DuckDB extension for every major OS/arch and publishes the
# loadable `.duckdb_extension` binaries to a GitHub Release so they can be
# downloaded (e.g. vendored into DataPilot's backend/app/vendor/mcap/<platform>/).
#
# Platform matrix (the names match DataPilot's _extension_path() keys):
#   linux_amd64   linux_arm64   osx_arm64   osx_amd64
#
# Windows is deliberately unsupported. DuckDB v1.4.4's vendored fmt uses
# stdext::checked_array_iterator, which the Visual Studio 18 STL on
# windows-latest removed, so duckdb_fmt cannot compile before this repo's own
# sources are even reached — nothing here can fix it.
#
# Trigger:
#   - push a tag like `v0.1.0`  -> builds all platforms + creates/updates that Release
#   - manual run (workflow_dispatch) -> builds + uploads artifacts only

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # needed to create/update Releases on tag builds

env:
  # Pin matches extension-ci-tools/_extension_distribution.yml for DuckDB v1.4.4.
  VCPKG_COMMIT: ce613c41372b23b1f51333815feb3edd87ef8a8b

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every entry sets a vcpkg triplet, and that is load-bearing: the
          # "Setup vcpkg" step and VCPKG_TOOLCHAIN_PATH are both gated on
          # `vcpkg_target_triplet != ''`. An entry without one silently falls
          # back to the runner's apt/brew libraries and links against them
          # dynamically, producing an artifact that only loads on a machine
          # carrying those exact library versions — which is how v0.1.2 shipped
          # three unusable binaries. Every *-release triplet sets
          # VCPKG_LIBRARY_LINKAGE static, which is what makes the published
          # extension self-contained.
          - platform: linux_amd64
            runner: ubuntu-22.04
            arch: amd64
            vcpkg_target_triplet: x64-linux-release
            vcpkg_host_triplet: x64-linux-release
          - platform: linux_arm64
            runner: ubuntu-22.04-arm
            arch: arm64
            vcpkg_target_triplet: arm64-linux-release
            vcpkg_host_triplet: arm64-linux-release
          - platform: osx_arm64
            runner: macos-14 # Apple Silicon runner
            arch: arm64
            vcpkg_target_triplet: arm64-osx-release
            vcpkg_host_triplet: arm64-osx-release
          # Cross-compiled x86_64 on an Apple Silicon runner: GitHub has retired
          # Intel macOS runners, and this is the path DuckDB itself uses.
          - platform: osx_amd64
            runner: macos-14
            arch: amd64
            osx_build_arch: x86_64
            vcpkg_target_triplet: x64-osx-release
            vcpkg_host_triplet: arm64-osx-release
            cross: true
    env:
      DUCKDB_PLATFORM: ${{ matrix.platform }}
      OSX_BUILD_ARCH: ${{ matrix.osx_build_arch }}
      GEN: ninja
      VCPKG_TARGET_TRIPLET: ${{ matrix.vcpkg_target_triplet }}
      VCPKG_HOST_TRIPLET: ${{ matrix.vcpkg_host_triplet }}
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/extension-ci-tools/vcpkg_ports
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # --- Dependencies -----------------------------------------------------
      # Build tooling only. lz4, zstd and protobuf deliberately come from vcpkg
      # instead: installing the apt/brew copies as well would put dynamic
      # libraries on the default search path, where find_library could pick one
      # up ahead of vcpkg's static build and quietly reintroduce the runtime
      # dependency this workflow exists to avoid.
      - name: Install build deps (Linux)
        if: startsWith(matrix.platform, 'linux')
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential cmake ninja-build pkg-config

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      # Unconditional on purpose. This used to be gated on
      # `matrix.vcpkg_target_triplet != ''`, so a row that forgot a triplet
      # skipped vcpkg in silence and linked against the runner's own libraries
      # — that is what shipped three unloadable binaries in v0.1.2. With no
      # gate, a missing triplet is a loud build failure instead.
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11.1
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

      # --- Build ------------------------------------------------------------
      # The standard extension-ci-tools Makefile builds the loadable extension
      # against the pinned DuckDB submodule (v1.4.4). GEN=ninja speeds it up.
      - name: Build extension
        env:
          VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
        run: make release

      - name: Locate built extension
        id: locate
        shell: bash
        run: |
          ext=$(find build/release -name 'mcap.duckdb_extension' | head -1)
          if [ -z "$ext" ]; then
            echo "::error::mcap.duckdb_extension not found under build/release"
            find build -name '*.duckdb_extension' || true
            exit 1
          fi
          echo "path=$ext" >> "$GITHUB_OUTPUT"
          echo "Built: $ext"
          file "$ext" || true

      # --- Portability gate -------------------------------------------------
      # The smoke test below cannot catch a dynamic-linkage mistake: it loads
      # the extension ON the build machine, where the apt/brew libraries are
      # installed, so it passes for an artifact that will load nowhere else.
      # That is exactly how v0.1.2 shipped three binaries that failed at dlopen
      # on every other machine. This step reads the binary's own dependency
      # table, so it fails on the runner that produced it rather than in a
      # user's hands.
      - name: Assert the extension is self-contained
        shell: bash
        run: |
          ext="${{ steps.locate.outputs.path }}"
          if [ "$RUNNER_OS" = "macOS" ]; then
            # Everything outside /usr/lib and /System/Library ships with the OS;
            # a Homebrew path here means the dependency was not linked in.
            bad=$(otool -L "$ext" | tail -n +2 | awk '{print $1}' \
                  | grep -vE '^(/usr/lib/|/System/Library/|@rpath/mcap\.duckdb_extension)' || true)
          else
            # Only the C/C++ runtime may be dynamic; protobuf, abseil, lz4 and
            # zstd must all be baked in.
            bad=$(readelf -d "$ext" | grep NEEDED | sed -E 's/.*\[(.*)\]/\1/' \
                  | grep -vE '^(libc\.so|libm\.so|libdl\.so|librt\.so|libpthread\.so|libstdc\+\+\.so|libgcc_s\.so|ld-linux)' || true)
          fi

          if [ -n "$bad" ]; then
            echo "::error::${{ matrix.platform }} extension is NOT self-contained; it would fail to load on any machine without these:"
            echo "$bad"
            echo
            echo "Cause: this matrix entry built without the vcpkg toolchain, so lz4/zstd/protobuf"
            echo "linked dynamically against the runner's own libraries. Give the entry a"
            echo "vcpkg_target_triplet (the *-release triplets link statically)."
            exit 1
          fi
          echo "OK: ${{ matrix.platform }} has no non-system dynamic dependencies."

      # --- Smoke test: load it and run a trivial query ----------------------
      # Uses setup-python rather than the runner's system python3, which on
      # macOS is Homebrew-managed and refuses `pip install` under PEP 668.
      - name: Set up Python
        if: ${{ !matrix.cross }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # A loadable extension is pinned to the exact DuckDB version it was built
      # against, so the client must match the submodule rather than float to
      # the newest 1.4.x (which is how this broke: built 1.4.4, pip gave 1.4.5).
      - name: Resolve pinned DuckDB version
        if: ${{ !matrix.cross }}
        id: duckdb_version
        shell: bash
        run: |
          ver=$(git -C duckdb describe --tags --abbrev=0)
          ver=${ver#v}
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Pinned DuckDB: $ver"

      # Skipped for osx_amd64: the x86_64 binary cannot be loaded by the arm64
      # Python on the runner that cross-compiled it.
      - name: Smoke test (load extension)
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          python -m pip install --quiet "duckdb==${{ steps.duckdb_version.outputs.version }}"
          python - "${{ steps.locate.outputs.path }}" <<'PY'
          import sys, duckdb
          ext = sys.argv[1]
          con = duckdb.connect(":memory:", config={"allow_unsigned_extensions": "true"})
          con.load_extension(ext)
          con.load_extension("json")
          # functions are registered if this binds without error
          con.execute("SELECT 1")
          print("OK: loaded", ext, "duckdb", duckdb.__version__)
          PY

      # --- Package: rename to <platform>/mcap.duckdb_extension --------------
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.platform }}"
          cp "${{ steps.locate.outputs.path }}" "dist/${{ matrix.platform }}/mcap.duckdb_extension"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcap-${{ matrix.platform }}
          path: dist/${{ matrix.platform }}/mcap.duckdb_extension
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Flatten into per-platform names so each Release asset is unique and the
      # platform is obvious from the filename:
      #   mcap-linux_amd64.duckdb_extension, mcap-osx_arm64.duckdb_extension, ...
      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release
          for dir in artifacts/mcap-*; do
            plat=$(basename "$dir" | sed 's/^mcap-//')
            cp "$dir/mcap.duckdb_extension" "release/mcap-${plat}.duckdb_extension"
          done
          ls -la release
          ( cd release && sha256sum *.duckdb_extension > SHA256SUMS )
          cat release/SHA256SUMS

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.duckdb_extension
            release/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true

name: Build & Release mcap extension

# Builds the `mcap` DuckDB extension for every major OS/arch and publishes the
# loadable `.duckdb_extension` binaries to a GitHub Release so they can be
# downloaded (e.g. vendored into DataPilot's backend/app/vendor/mcap/<platform>/).
#
# Platform matrix (the names match DataPilot's _extension_path() keys):
#   linux_amd64   linux_arm64   osx_arm64   osx_amd64   windows_amd64
#
# Trigger:
#   - push a tag like `v0.1.0`  -> builds all platforms + creates/updates that Release
#   - manual run (workflow_dispatch) -> builds + uploads artifacts only

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # needed to create/update Releases on tag builds

env:
  # Pin matches extension-ci-tools/_extension_distribution.yml for DuckDB v1.4.4.
  VCPKG_COMMIT: ce613c41372b23b1f51333815feb3edd87ef8a8b

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_amd64
            runner: ubuntu-22.04
            arch: amd64
          - platform: linux_arm64
            runner: ubuntu-22.04-arm
            arch: arm64
          - platform: osx_arm64
            runner: macos-14 # Apple Silicon runner
            arch: arm64
          # Cross-compiled x86_64 on an Apple Silicon runner: GitHub has retired
          # Intel macOS runners, and this is the path DuckDB itself uses. Deps
          # come from vcpkg because Homebrew here is arm64-only.
          - platform: osx_amd64
            runner: macos-14
            arch: amd64
            osx_build_arch: x86_64
            vcpkg_target_triplet: x64-osx-release
            vcpkg_host_triplet: arm64-osx-release
            cross: true
          - platform: windows_amd64
            runner: windows-latest
            arch: amd64
            vcpkg_target_triplet: x64-windows-static-md-release-vs2019comp
            vcpkg_host_triplet: x64-windows-static-md-release-vs2019comp
    env:
      DUCKDB_PLATFORM: ${{ matrix.platform }}
      OSX_BUILD_ARCH: ${{ matrix.osx_build_arch }}
      GEN: ninja
      VCPKG_TARGET_TRIPLET: ${{ matrix.vcpkg_target_triplet }}
      VCPKG_HOST_TRIPLET: ${{ matrix.vcpkg_host_triplet }}
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/extension-ci-tools/toolchains
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/extension-ci-tools/vcpkg_ports
    steps:
      # Must precede checkout so CRLF conversion never touches the binary
      # .mcap fixtures or the shell scripts.
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # --- Dependencies -----------------------------------------------------
      - name: Install build deps (Linux)
        if: startsWith(matrix.platform, 'linux')
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential cmake ninja-build pkg-config \
            liblz4-dev libzstd-dev libprotobuf-dev protobuf-compiler

      # osx_arm64 only; osx_amd64 sources its x86_64 deps from vcpkg instead.
      - name: Install build deps (macOS)
        if: matrix.platform == 'osx_arm64'
        run: |
          brew install cmake ninja lz4 zstd protobuf

      - name: Install Ninja (macOS cross)
        if: matrix.platform == 'osx_amd64'
        run: brew install ninja

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - name: Setup vcpkg
        if: matrix.vcpkg_target_triplet != ''
        uses: lukka/run-vcpkg@v11.1
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

      # --- Build ------------------------------------------------------------
      # The standard extension-ci-tools Makefile builds the loadable extension
      # against the pinned DuckDB submodule (v1.4.4). GEN=ninja speeds it up.
      - name: Build extension
        if: runner.os != 'Windows'
        env:
          VCPKG_TOOLCHAIN_PATH: ${{ matrix.vcpkg_target_triplet != '' && format('{0}/vcpkg/scripts/buildsystems/vcpkg.cmake', github.workspace) || '' }}
        run: make release

      # MSVC needs its environment set up in-process, so this runs through cmd
      # rather than bash. Git ships a link.exe that shadows MSVC's linker on PATH.
      - name: Build extension (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if exist "C:\Program Files\Git\usr\bin\link.exe" move "C:\Program Files\Git\usr\bin\link.exe" "C:\Program Files\Git\usr\bin\link-git.exe"
          make release

      - name: Locate built extension
        id: locate
        shell: bash
        run: |
          ext=$(find build/release -name 'mcap.duckdb_extension' | head -1)
          if [ -z "$ext" ]; then
            echo "::error::mcap.duckdb_extension not found under build/release"
            find build -name '*.duckdb_extension' || true
            exit 1
          fi
          echo "path=$ext" >> "$GITHUB_OUTPUT"
          echo "Built: $ext"
          file "$ext" || true

      # --- Smoke test: load it and run a trivial query ----------------------
      # Skipped for osx_amd64: the x86_64 binary cannot be loaded by the arm64
      # Python on the runner that cross-compiled it.
      - name: Smoke test (load extension)
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          python3 -m pip install --quiet "duckdb>=1.4,<1.5"
          python3 - "${{ steps.locate.outputs.path }}" <<'PY'
          import sys, duckdb
          ext = sys.argv[1]
          con = duckdb.connect(":memory:", config={"allow_unsigned_extensions": "true"})
          con.load_extension(ext)
          con.load_extension("json")
          # functions are registered if this binds without error
          con.execute("SELECT 1")
          print("OK: loaded", ext, "duckdb", duckdb.__version__)
          PY

      # --- Package: rename to <platform>/mcap.duckdb_extension --------------
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.platform }}"
          cp "${{ steps.locate.outputs.path }}" "dist/${{ matrix.platform }}/mcap.duckdb_extension"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcap-${{ matrix.platform }}
          path: dist/${{ matrix.platform }}/mcap.duckdb_extension
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Flatten into per-platform names so each Release asset is unique and the
      # platform is obvious from the filename:
      #   mcap-linux_amd64.duckdb_extension, mcap-osx_arm64.duckdb_extension, ...
      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release
          for dir in artifacts/mcap-*; do
            plat=$(basename "$dir" | sed 's/^mcap-//')
            cp "$dir/mcap.duckdb_extension" "release/mcap-${plat}.duckdb_extension"
          done
          ls -la release
          ( cd release && sha256sum *.duckdb_extension > SHA256SUMS )
          cat release/SHA256SUMS

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.duckdb_extension
            release/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true

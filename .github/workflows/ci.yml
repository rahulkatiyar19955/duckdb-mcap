name: CI

# Lightweight build + test on every push/PR. Builds the extension against the
# pinned DuckDB (v1.4.4) and runs the sqllogictest suite via `make test`.
# Release/packaging lives in release.yml and is intentionally separate.
#
# lz4, zstd and protobuf come from vcpkg on every platform, matching release.yml
# exactly. They used to come from apt/brew on linux_* and osx_arm64, which linked
# them dynamically; that is what shipped three unloadable binaries in v0.1.2. The
# two workflows must agree, or a PR passes against a dependency configuration the
# release never uses and the difference only surfaces after a tag is pushed.
# The vcpkg commit and triplets match DuckDB's own distribution matrix
# (extension-ci-tools/config/distribution_matrix.json).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin matches extension-ci-tools/_extension_distribution.yml for DuckDB v1.4.4.
  VCPKG_COMMIT: ce613c41372b23b1f51333815feb3edd87ef8a8b

jobs:
  build-and-test:
    name: build & test (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every entry needs a vcpkg triplet: "Setup vcpkg" and
          # VCPKG_TOOLCHAIN_PATH are gated on it, and an entry without one falls
          # back to the runner's apt/brew libraries and links them dynamically.
          - platform: linux_amd64
            runner: ubuntu-22.04
            vcpkg_target_triplet: x64-linux-release
            vcpkg_host_triplet: x64-linux-release
          - platform: linux_arm64
            runner: ubuntu-22.04-arm
            vcpkg_target_triplet: arm64-linux-release
            vcpkg_host_triplet: arm64-linux-release
          - platform: osx_arm64
            runner: macos-14
            vcpkg_target_triplet: arm64-osx-release
            vcpkg_host_triplet: arm64-osx-release
          # Cross-compiled x86_64 on an Apple Silicon runner. GitHub has retired
          # Intel macOS runners, and this is the path DuckDB itself uses. The
          # resulting binary cannot execute here, so this row is build-only.
          - platform: osx_amd64
            runner: macos-14
            osx_build_arch: x86_64
            vcpkg_target_triplet: x64-osx-release
            vcpkg_host_triplet: arm64-osx-release
            cross: true
    env:
      DUCKDB_PLATFORM: ${{ matrix.platform }}
      OSX_BUILD_ARCH: ${{ matrix.osx_build_arch }}
      GEN: ninja
      VCPKG_TARGET_TRIPLET: ${{ matrix.vcpkg_target_triplet }}
      VCPKG_HOST_TRIPLET: ${{ matrix.vcpkg_host_triplet }}
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/extension-ci-tools/vcpkg_ports
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Build tooling only — lz4/zstd/protobuf come from vcpkg. Installing the
      # apt/brew copies too would place dynamic libraries on the default search
      # path, where find_library could pick one up ahead of vcpkg's static build.
      - name: Install build deps (Linux)
        if: startsWith(matrix.platform, 'linux')
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential cmake ninja-build pkg-config

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      # Unconditional on purpose. This used to be gated on
      # `matrix.vcpkg_target_triplet != ''`, so a row that forgot a triplet
      # skipped vcpkg in silence and linked against the runner's own libraries.
      # With no gate, a missing triplet is a loud build failure instead.
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11.1
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

      # Test fixtures are committed, but regenerate them so generator drift is
      # also caught by CI. Needs the python mcap + protobuf writers.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The check verifies repo integrity (committed bytes == generator output),
      # not anything platform-specific, so running it once per native row is
      # enough; osx_amd64 skips it because that row is build-only.
      - name: Regenerate MCAP test fixtures
        if: ${{ !matrix.cross }}
        run: |
          python -m pip install --quiet -r test/requirements.txt
          python test/generate_sample_mcap.py
          python test/generate_protobuf_mcap.py
          python test/generate_ros2_mcap.py

      # Committed fixtures must match what the pinned generators produce, so a
      # generator (or dependency) change can never silently diverge from them.
      - name: Check fixture drift
        if: ${{ !matrix.cross }}
        run: git diff --exit-code -- test/mcap

      - name: Build extension
        env:
          VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
        run: make release

      # --- Portability gate -------------------------------------------------
      # Mirrors release.yml. `make test` below cannot catch a dynamic-linkage
      # mistake, because it loads the extension on the machine that built it,
      # where the apt/brew libraries are present. Reading the binary's own
      # dependency table is the only check that fails here rather than on a
      # user's machine. Runs for cross builds too — inspecting a Mach-O needs no
      # ability to execute it.
      - name: Assert the extension is self-contained
        shell: bash
        run: |
          ext=$(find build/release -name 'mcap.duckdb_extension' | head -1)
          if [ -z "$ext" ]; then echo "::error::mcap.duckdb_extension not found"; exit 1; fi

          if [ "$RUNNER_OS" = "macOS" ]; then
            bad=$(otool -L "$ext" | tail -n +2 | awk '{print $1}' \
                  | grep -vE '^(/usr/lib/|/System/Library/|@rpath/mcap\.duckdb_extension)' || true)
          else
            bad=$(readelf -d "$ext" | grep NEEDED | sed -E 's/.*\[(.*)\]/\1/' \
                  | grep -vE '^(libc\.so|libm\.so|libdl\.so|librt\.so|libpthread\.so|libstdc\+\+\.so|libgcc_s\.so|ld-linux)' || true)
          fi

          if [ -n "$bad" ]; then
            echo "::error::${{ matrix.platform }} extension is NOT self-contained; it would fail to load on any machine without these:"
            echo "$bad"
            echo
            echo "Cause: this matrix entry built without the vcpkg toolchain, so lz4/zstd/protobuf"
            echo "linked dynamically against the runner's own libraries. Give the entry a"
            echo "vcpkg_target_triplet (the *-release triplets link statically)."
            exit 1
          fi
          echo "OK: ${{ matrix.platform }} has no non-system dynamic dependencies."

      # Skipped for osx_amd64: an x86_64 unittest binary cannot run on the
      # arm64 runner that produced it. Mirrors upstream's own matrix.
      - name: Run test suite
        if: ${{ !matrix.cross }}
        shell: bash
        run: make test

      - name: Run C++ unit tests
        if: ${{ !matrix.cross }}
        run: ./run_cpp_tests.sh

name: CI

# Lightweight build + test on every push/PR. Builds the extension against the
# pinned DuckDB (v1.4.4) and runs the sqllogictest suite via `make test`.
# Release/packaging lives in release.yml and is intentionally separate.
#
# Dependency sourcing differs by platform:
#   linux_*, osx_arm64  -> apt / brew (native, fast)
#   osx_amd64           -> vcpkg, because Homebrew on an arm64 runner cannot
#                          supply x86_64 builds of lz4/zstd/protobuf
#   windows_amd64       -> vcpkg, the only practical source on Windows
# The vcpkg commit and triplets match DuckDB's own distribution matrix
# (extension-ci-tools/config/distribution_matrix.json).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin matches extension-ci-tools/_extension_distribution.yml for DuckDB v1.4.4.
  VCPKG_COMMIT: ce613c41372b23b1f51333815feb3edd87ef8a8b

jobs:
  build-and-test:
    name: build & test (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_amd64
            runner: ubuntu-22.04
          - platform: linux_arm64
            runner: ubuntu-22.04-arm
          - platform: osx_arm64
            runner: macos-14
          # Cross-compiled x86_64 on an Apple Silicon runner. GitHub has retired
          # Intel macOS runners, and this is the path DuckDB itself uses. The
          # resulting binary cannot execute here, so this row is build-only.
          - platform: osx_amd64
            runner: macos-14
            osx_build_arch: x86_64
            vcpkg_target_triplet: x64-osx-release
            vcpkg_host_triplet: arm64-osx-release
            cross: true
          - platform: windows_amd64
            runner: windows-latest
            vcpkg_target_triplet: x64-windows-static-md-release-vs2019comp
            vcpkg_host_triplet: x64-windows-static-md-release-vs2019comp
    env:
      DUCKDB_PLATFORM: ${{ matrix.platform }}
      OSX_BUILD_ARCH: ${{ matrix.osx_build_arch }}
      GEN: ninja
      VCPKG_TARGET_TRIPLET: ${{ matrix.vcpkg_target_triplet }}
      VCPKG_HOST_TRIPLET: ${{ matrix.vcpkg_host_triplet }}
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/extension-ci-tools/toolchains
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/extension-ci-tools/vcpkg_ports
    steps:
      # Must precede checkout: the committed .mcap fixtures are binary and CRLF
      # rewriting would break both the build inputs and the drift check below.
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build deps (Linux)
        if: startsWith(matrix.platform, 'linux')
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential cmake ninja-build pkg-config \
            liblz4-dev libzstd-dev libprotobuf-dev protobuf-compiler

      # osx_arm64 only. osx_amd64 deliberately gets its deps from vcpkg instead;
      # Homebrew here would hand back arm64 libraries and fail the cross link.
      - name: Install build deps (macOS)
        if: matrix.platform == 'osx_arm64'
        run: brew install cmake ninja lz4 zstd protobuf

      - name: Install Ninja (macOS cross)
        if: matrix.platform == 'osx_amd64'
        run: brew install ninja

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - name: Setup vcpkg
        if: matrix.vcpkg_target_triplet != ''
        uses: lukka/run-vcpkg@v11.1
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

      # Test fixtures are committed, but regenerate them so generator drift is
      # also caught by CI. Needs the python mcap + protobuf writers.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Only on the platforms that already did this. The check verifies repo
      # integrity (committed bytes == generator output), not anything
      # platform-specific, so the two new rows skip it: osx_amd64 is build-only,
      # and adding a byte-exactness check to the Windows row would only invite
      # flakiness on the riskiest job.
      - name: Regenerate MCAP test fixtures
        if: matrix.platform == 'linux_amd64' || matrix.platform == 'linux_arm64' || matrix.platform == 'osx_arm64'
        run: |
          python -m pip install --quiet -r test/requirements.txt
          python test/generate_sample_mcap.py
          python test/generate_protobuf_mcap.py
          python test/generate_ros2_mcap.py

      # Committed fixtures must match what the pinned generators produce, so a
      # generator (or dependency) change can never silently diverge from them.
      - name: Check fixture drift
        if: matrix.platform == 'linux_amd64' || matrix.platform == 'linux_arm64' || matrix.platform == 'osx_arm64'
        run: git diff --exit-code -- test/mcap

      - name: Build extension
        if: runner.os != 'Windows'
        env:
          VCPKG_TOOLCHAIN_PATH: ${{ matrix.vcpkg_target_triplet != '' && format('{0}/vcpkg/scripts/buildsystems/vcpkg.cmake', github.workspace) || '' }}
        run: make release

      # MSVC needs its environment set up in-process, so this runs through cmd
      # rather than bash. Git ships a link.exe that shadows MSVC's linker on PATH.
      - name: Build extension (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if exist "C:\Program Files\Git\usr\bin\link.exe" move "C:\Program Files\Git\usr\bin\link.exe" "C:\Program Files\Git\usr\bin\link-git.exe"
          make release

      # Skipped for osx_amd64: an x86_64 unittest binary cannot run on the
      # arm64 runner that produced it. Mirrors upstream's own matrix.
      - name: Run test suite
        if: ${{ !matrix.cross }}
        shell: bash
        run: make test

      # run_cpp_tests.sh drives a Unix toolchain directly (c++, -Wl,-rpath,
      # lib*.dylib/.so), so it does not apply to the MSVC build.
      - name: Run C++ unit tests
        if: ${{ !matrix.cross && runner.os != 'Windows' }}
        run: ./run_cpp_tests.sh
